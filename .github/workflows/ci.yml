name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run unit tests
        run: python -m pytest -q

  notebooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Execute all notebooks
        run: |
          python -m nbconvert --to notebook --execute --inplace notebooks/01_eda.ipynb
          python -m nbconvert --to notebook --execute --inplace notebooks/02_baseline.ipynb
          python -m nbconvert --to notebook --execute --inplace notebooks/03_fairness.ipynb
          python -m nbconvert --to notebook --execute --inplace notebooks/04_constrained.ipynb
          python -m nbconvert --to notebook --execute --inplace notebooks/05_individual_fairness.ipynb
          python -m nbconvert --to notebook --execute --inplace notebooks/06_remove_variable.ipynb
